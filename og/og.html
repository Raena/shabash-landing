<!DOCTYPE html>
<!-- Source for docs/og-image.png (1200×630). Re-render with og/render.sh -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Dela Gothic One';src:url(../docs/fonts/DelaGothicOne-latin.woff2)}
@font-face{font-family:'Hanken Grotesk';font-weight:400 700;src:url(../docs/fonts/HankenGrotesk-latin.woff2)}
@font-face{font-family:'Newsreader';font-weight:400 600;src:url(../docs/fonts/Newsreader-latin.woff2)}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:400 500;src:url(../docs/fonts/Newsreader-italic-latin.woff2)}
@font-face{font-family:'JetBrains Mono';src:url(../docs/fonts/JetBrainsMono-latin.woff2)}
:root{--ink:#15131c;--deep:#0a0910;--pk:#ff8a3d;--paper:#f1e6d2;--lp:#fbf4e6;--star:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background-color:var(--paper);background-image:radial-gradient(rgba(21,19,28,.05) 1px,transparent 1.3px),radial-gradient(rgba(21,19,28,.035) 1px,transparent 1.3px);background-size:5px 5px,9px 9px;background-position:0 0,3px 4px;position:relative;font-family:'Hanken Grotesk'}
.p1{position:absolute;left:22px;top:22px;width:700px;height:586px;background:var(--ink);clip-path:polygon(0 14px,100% 0,calc(100% - 72px) 100%,0 calc(100% - 22px))}
.p2{position:absolute;left:668px;top:22px;width:510px;height:586px;background:var(--pk);clip-path:polygon(72px 0,100% 16px,100% calc(100% - 30px),calc(100% - 48px) 100%,0 100%)}
.stitch{position:absolute;left:0;top:0;width:1200px;height:630px}
.narr{position:absolute;transform:rotate(var(--r));filter:drop-shadow(5px 5px 0 var(--sh,var(--pk)));font:italic 500 26px 'Newsreader';white-space:nowrap}
.narr>span{display:block;background:var(--ink);padding:4px;clip-path:polygon(0 4%,100% 0,98.5% 100%,1% 94%)}
.narr>span>span{display:block;background:var(--lp);color:var(--ink);padding:6px 22px 8px;clip-path:polygon(0 4%,100% 0,98.5% 100%,1% 94%)}
h1{position:absolute;left:70px;top:128px;font:400 128px/.95 'Dela Gothic One';letter-spacing:-.03em;color:var(--paper)}
h1 .a{text-shadow:4px 3px 0 var(--pk)} h1 .b{color:var(--pk)}
.dict{position:absolute;left:70px;top:398px;width:520px;border-top:2px solid rgba(241,230,210,.3);border-bottom:2px solid rgba(241,230,210,.3);padding:12px 0 14px;color:var(--paper);font:400 25px/1.35 'Newsreader'}
.dict b{font-weight:600}.dict i{color:var(--pk)}.dict .n{color:var(--pk);font-weight:600}
.domain{position:absolute;left:70px;top:548px;font:400 20px 'JetBrains Mono';letter-spacing:.06em;color:var(--paper)}
.star{position:absolute;clip-path:var(--star)}
.moon{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--paper)}
.moon::after{content:"";position:absolute;left:10px;top:-5px;width:32px;height:32px;border-radius:50%;background:var(--ink)}
.brand{position:absolute;left:770px;top:92px;display:flex;align-items:center;gap:14px;font:400 44px/1 'Dela Gothic One';letter-spacing:-.02em;color:var(--ink)}
.chap{position:absolute;left:770px;top:160px;font:400 18px 'JetBrains Mono';letter-spacing:.06em;color:var(--ink)}
.plate-wrap{position:absolute;left:740px;top:352px;filter:drop-shadow(8px 8px 0 var(--ink))}
.plate{width:400px;background:var(--paper);color:var(--ink);clip-path:polygon(0 9%,100% 0,98.5% 100%,1.5% 93%);padding:34px 30px 30px 40px}
.vol{font:400 16px 'JetBrains Mono';letter-spacing:.08em}
.title{font:400 50px/1 'Dela Gothic One';letter-spacing:-.03em;margin:8px 0 8px}
.tag{font:italic 400 22px/1.3 'Newsreader'}
.slab-wrap{position:absolute;left:700px;top:258px;transform:rotate(-4deg);filter:drop-shadow(7px 7px 0 var(--deep))}
.slab-o{background:var(--paper);padding:4px;clip-path:polygon(0 0,100% 13%,96% 86%,0 100%)}
.slab{background:var(--ink);color:var(--pk);padding:22px 52px 24px 30px;clip-path:polygon(0 0,100% 13%,96% 86%,0 100%)}
.slab .w{font:400 40px/1 'Dela Gothic One';text-transform:uppercase}
.slab .s{font:700 14px/1 'Hanken Grotesk';letter-spacing:.12em;text-transform:uppercase;margin-top:8px;color:var(--paper)}
</style></head>
<body>
<div class="p1"></div>
<div class="p2"></div>
<svg class="stitch"><line x1="704" y1="22" x2="668" y2="608" stroke="#15131c" stroke-width="3" stroke-dasharray="9 8"/>
<g stroke="#f1e6d2" stroke-opacity=".32" stroke-dasharray="2 6"><line x1="420" y1="96" x2="490" y2="52"/><line x1="490" y1="52" x2="570" y2="84"/><line x1="570" y1="84" x2="610" y2="44"/></g></svg>
<span class="star" style="left:415px;top:91px;width:10px;height:10px;background:var(--paper)"></span>
<span class="star" style="left:478px;top:40px;width:24px;height:24px;background:var(--pk)"></span>
<span class="star" style="left:563px;top:77px;width:14px;height:14px;background:var(--paper)"></span>
<span class="star" style="left:601px;top:35px;width:18px;height:18px;background:var(--pk)"></span>
<span class="moon" style="left:650px;top:74px"></span>
<div class="narr" style="left:46px;top:40px;--r:-2deg"><span><span>Once upon a deadline…</span></span></div>
<h1><span class="a">We craft</span><br><span class="b">games.</span></h1>
<div class="dict"><div><b>sha·bash</b> &nbsp;<i>(n.)</i></div><div><span class="n">1.</span> a wild gathering where witchery happens and indie games are crafted.</div></div>
<div class="domain">shabash.games</div>
<div class="brand">shabash</div>
<div class="chap">✦ VOL. 01 · IN DEVELOPMENT</div>
<div class="plate-wrap"><div class="plate"><div class="vol">VOL. 01</div><div class="title">Bookbinder</div><div class="tag">A game about restoring old books.</div></div></div>
<div class="slab-wrap"><div class="slab-o"><div class="slab"><div class="w">Wishlist</div><div class="s">on Steam ↗</div></div></div></div>
</body></html>
